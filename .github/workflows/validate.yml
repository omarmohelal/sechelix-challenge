name: Validate challenge

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Challenge self-tests
        run: python -m unittest test_challenge -v

      - name: The blind packet builds and leaks nothing
        run: |
          set -euo pipefail
          python pack.py --out blind
          test ! -e blind/truth
          ! grep -rl "accept_terms\|root_cause" blind/ || { echo "::error::blind packet leaks answers"; exit 1; }

      - name: The example submission scores
        run: python score.py answers.example.json

      - name: The quiz page is not stale
        run: |
          set -euo pipefail
          python build_quiz.py
          git diff --exit-code -- docs/index.html             || { echo "::error::docs/index.html is stale — run build_quiz.py and commit"; exit 1; }
